name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
          enable-cache: true

      - name: Install FontForge on macOS
        if: runner.os == 'macOS'
        run: brew bundle

      - name: Install FontForge for non-native tests on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes fontforge

      - name: Install locked dependencies
        run: uv sync --all-extras --frozen --python 3.12

      - name: Lint and type-check Python
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run mypy src/font_maker

      - name: Validate plugin and skill discovery metadata
        run: uv run pytest tests/test_distribution.py

      - name: Run full macOS suite
        if: runner.os == 'macOS'
        run: uv run pytest --cov=font_maker --cov-report=term-missing

      - name: Run portable Ubuntu suite
        if: runner.os == 'Linux'
        run: uv run pytest -m "not fontforge" --cov=font_maker --cov-report=term-missing

      - name: Validate package build
        run: uv build
