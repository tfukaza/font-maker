<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1000 1000"
     width="1000" height="1000"
     data-fontmaker-family="Snap Grid"
     data-fontmaker-upm="1000"
     data-fontmaker-baseline-y="800">
  <title>Snap Grid shared glyph template</title>
  <desc>Draw filled outlines only inside #glyph. Do not crop or move the baseline.</desc>
  <g id="fontmaker-guides" data-fontmaker-ignore="true"
     fill="none" stroke-width="1" vector-effect="non-scaling-stroke">
    <line id="ascender-guide" x1="0" x2="1000" y1="0" y2="0" stroke="#8b5cf6" opacity="0.45"/>
    <line id="cap-height-guide" x1="0" x2="1000" y1="100" y2="100" stroke="#3b82f6" opacity="0.45"/>
    <line id="x-height-guide" x1="0" x2="1000" y1="300" y2="300" stroke="#10b981" opacity="0.45"/>
    <line id="baseline" data-fontmaker-baseline="true" x1="0" x2="1000" y1="800" y2="800" stroke="#ef4444" stroke-width="2"/>
    <line id="descender-guide" x1="0" x2="1000" y1="1000" y2="1000" stroke="#f59e0b" opacity="0.45"/>
  </g>
  <g id="glyph" fill="#000000"></g>
</svg>
