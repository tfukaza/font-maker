<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1000 1070"
     width="1000" height="1070"
     data-fontmaker-family="Party Blob"
     data-fontmaker-upm="1000"
     data-fontmaker-baseline-y="800">
  <title>Party Blob shared glyph template</title>
  <desc>Draw filled outlines only inside #glyph. Do not crop or move the baseline.</desc>
  <g id="fontmaker-guides" data-fontmaker-ignore="true"
     fill="none" stroke-width="1" vector-effect="non-scaling-stroke">
    <line id="ascender-guide" x1="0" x2="1000" y1="0" y2="0" stroke="#8b5cf6" opacity="0.45"/>
    <line id="cap-height-guide" x1="0" x2="1000" y1="80" y2="80" stroke="#3b82f6" opacity="0.45"/>
    <line id="x-height-guide" x1="0" x2="1000" y1="380" y2="380" stroke="#10b981" opacity="0.45"/>
    <line id="baseline" data-fontmaker-baseline="true" x1="0" x2="1000" y1="800" y2="800" stroke="#ef4444" stroke-width="2"/>
    <line id="descender-guide" x1="0" x2="1000" y1="1070" y2="1070" stroke="#f59e0b" opacity="0.45"/>
  </g>
  <g id="glyph" fill="#000000"><path d="M57 98 C93 77 135 97 130 136 C124 181 91 207 48 229 C69 195 80 169 72 157 C38 151 30 117 57 98 Z"/></g>
</svg>
